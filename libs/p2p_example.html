<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostr P2P Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: #8b5cf6; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        .panels {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            flex-wrap: wrap;
        }
        .panel {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }
        .badge {
            background: #8b5cf6;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }
        .status-dot.connected { background: #22c55e; }
        .status-dot.connecting { background: #f59e0b; }
        .npub-box {
            font-family: monospace;
            font-size: 11px;
            color: #888;
            word-break: break-all;
            background: #0f0f0f;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            cursor: pointer;
            transition: background 0.2s;
        }
        .npub-box:hover { background: #1a1a1a; }
        .npub-box:active { background: #222; }
        .copy-hint {
            font-size: 10px;
            color: #555;
            text-align: right;
        }
        input, button {
            background: #0f0f0f;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #8b5cf6; }
        button {
            background: #8b5cf6;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary {
            background: #333;
            font-size: 12px;
            padding: 6px 12px;
        }
        button.danger {
            background: #ef4444;
            font-size: 11px;
            padding: 4px 8px;
        }
        .chat-area {
            min-height: 200px;
            max-height: 350px;
            overflow-y: auto;
            background: #0f0f0f;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #222;
        }
        .chat-msg {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 85%;
            word-break: break-word;
        }
        .chat-msg.incoming { background: #1e3a5f; align-self: flex-start; }
        .chat-msg.outgoing { background: #2d1b4e; align-self: flex-end; }
        .chat-msg.system { background: #1a1a1a; color: #888; align-self: center; font-size: 12px; font-style: italic; }
        .chat-msg .sender { font-size: 10px; color: #aaa; margin-bottom: 2px; }
        .input-row { display: flex; gap: 8px; }
        .input-row input { flex: 1; }
        .input-row button { padding: 10px 20px; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .peer-list {
            max-height: 200px;
            overflow-y: auto;
            background: #0f0f0f;
            border-radius: 8px;
            border: 1px solid #222;
        }
        .peer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #222;
            font-size: 12px;
            font-family: monospace;
        }
        .peer-item:last-child { border-bottom: none; }
        .peer-item .peer-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .peer-status.active { background: #22c55e; }
        .peer-status.pending { background: #f59e0b; }
        .peer-status.offline { background: #666; }
        .stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #888;
        }
        .stats span { display: flex; align-items: center; gap: 4px; }
        label { font-size: 12px; color: #888; }
        .add-peer-row { display: flex; gap: 8px; }
        .add-peer-row input { flex: 1; }
        .add-peer-row button { padding: 10px 14px; }
    </style>
<base target="_blank">
<base target="_blank">
</head>
<body>
    <h1>Nostr P2P Chat</h1>
    <p class="subtitle">Add peers to your list. The network will automatically connect and rotate connections.</p>

    <div class="panels">
        <!-- Left Panel: Identity & Peers -->
        <div class="panel">
            <div class="header">
                <span class="badge">Your Node</span>
                <div class="stats">
                    <span><span class="status-dot connected" style="position:static;"></span> <span id="activeCount">0</span> active</span>
                    <span><span class="status-dot connecting" style="position:static;"></span> <span id="pendingCount">0</span> pending</span>
                </div>
            </div>

            <label>Your npub (click to copy):</label>
            <div class="npub-box" id="myNpub" onclick="copyNpub()">Generating key...</div>
            <div class="copy-hint" id="copyHint">Click to copy</div>

            <label>Add Peer:</label>
            <div class="add-peer-row">
                <input type="text" id="peerNpubInput" placeholder="Paste peer npub here...">
                <button onclick="addPeer()">Add</button>
            </div>

            <label>Peer List (<span id="peerListCount">0</span>):</label>
            <div class="peer-list" id="peerList">
                <div class="peer-item" style="color:#666; font-style:italic;">No peers added yet</div>
            </div>
        </div>

        <!-- Right Panel: Chat -->
        <div class="panel">
            <div class="header">
                <span class="badge">Chat</span>
                <div class="status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Disconnected</span>
                </div>
            </div>

            <div class="chat-area" id="chat"></div>

            <div class="input-row">
                <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()">
                <button onclick="send()">Send</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script type="module">
        import { generateSecretKey } from 'https://esm.sh/jsr/@nostr/tools@2.23.6/pure';
        import { bytesToHex } from 'https://esm.sh/@noble/hashes@1.7.1/utils';
        import { NostrP2P } from './p2p.js';
        import { signPayload, verifyPayload } from "./crypto.js";
        let p2p;
        function addChat(msg, type, senderNpub = null) {
            const chatEl = document.getElementById('chat');
            const entry = document.createElement('div');
            entry.className = 'chat-msg ' + type;
            if (type === 'incoming') {
                const short = senderNpub ? senderNpub.slice(0, 16) + '...' : 'Peer';
                entry.innerHTML = `<div class="sender">${short}</div>${msg}`;
            } else if (type === 'outgoing') {
                entry.innerHTML = `<div class="sender">You</div>${msg}`;
            } else {
                entry.textContent = msg;
            }
            chatEl.appendChild(entry);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function setStatus(state) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = 'status-dot ' + state;
            if (state === 'connected') text.textContent = 'Connected';
            else if (state === 'connecting') text.textContent = 'Connecting...';
            else text.textContent = 'Disconnected';
        }

        function updateStats() {
            if (!p2p) return;
            let active = 0;
            for (const [, conn] of p2p.connections) {
                if (conn.authenticated) active++;
            }
            document.getElementById('activeCount').textContent = active;
            document.getElementById('pendingCount').textContent = p2p.pendingConnections?.size || 0;
        }

        function renderPeerList() {
            const listEl = document.getElementById('peerList');
            const countEl = document.getElementById('peerListCount');
            countEl.textContent = p2p.peers.size;

            if (p2p.peers.size === 0) {
                listEl.innerHTML = '<div class="peer-item" style="color:#666; font-style:italic;">No peers added yet</div>';
                return;
            }

            listEl.innerHTML = '';
            for (const npub of p2p.peers) {
                const isActive = p2p?.isConnected(npub);
                const isPending = p2p?.pendingConnections?.has(npub);
                let statusClass = 'offline';
                if (isActive) statusClass = 'active';
                else if (isPending) statusClass = 'pending';

                const item = document.createElement('div');
                item.className = 'peer-item';
                item.innerHTML = `
                    <div style="display:flex;align-items:center;flex:1;min-width:0;">
                        <span class="peer-status ${statusClass}"></span>
                        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${npub}</span>
                    </div>
                    <button class="danger" onclick="removePeer('${npub}')">&times;</button>
                `;
                listEl.appendChild(item);
            }
        }

        window.addPeer = () => {
            const input = document.getElementById('peerNpubInput');
            const npub = input.value.trim();
            if (!npub) return;
            if (npub === p2p?.npub) {
                addChat('Cannot add yourself as a peer.', 'system');
                return;
            }
            if (p2p.peers.has(npub)) {
                addChat('Peer already in list.', 'system');
                return;
            }
            p2p?.addPeer(npub);
            input.value = '';
            renderPeerList();
            addChat('Added peer: ' + npub.slice(0, 16) + '...', 'system');
        };

        window.removePeer = (npub) => {
            p2p.removePeer(npub);
            renderPeerList();
            addChat('Removed peer: ' + npub.slice(0, 16) + '...', 'system');
        };

        window.copyNpub = async () => {
            const npub = document.getElementById('myNpub').textContent;
            const toast = document.getElementById('toast');
            
            try {
                await navigator.clipboard.writeText(npub);
                showToast(toast);
            } catch (e) {
                // Fallback for HTTP or older browsers
                const selection = window.getSelection();
                const range = document.createRange();
                range.selectNode(document.getElementById('myNpub'));
                selection.removeAllRanges();
                selection.addRange(range);
                
                document.execCommand('copy');
                selection.removeAllRanges();
                
                showToast(toast);
            }
        };

        function showToast(toast) {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }
        window.send = () => {
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            const payload = { msg: msg, npub: p2p.npub, ts: Date.now() };
            payload.sig = signPayload(payload, p2p.hex_sk);
            if (!msg) return;
            try {
                // Broadcast to all connected peers
                p2p.broadcast(JSON.stringify(payload));
                addChat(msg, 'outgoing');
                input.value = '';
            } catch (e) {
                addChat('Error: ' + e.message, 'system');
            }
        };

        async function init() {
            const sk = generateSecretKey();
            const messagelist = new Set();
            p2p = new NostrP2P(bytesToHex(sk), {
                maxConnections: 2,
                pendingSlots: 1,
                rotationInterval: 30000,
                minConnectionAge: 45000,
                onConnect: (npub) => {
                    setStatus('connected');
                    addChat('Connected to ' + npub.slice(0, 16) + '...', 'system');
                    renderPeerList();
                    updateStats();
                },
                onDisconnect: (npub) => {
                    addChat('Disconnected from ' + npub.slice(0, 16) + '...', 'system');
                    renderPeerList();
                    updateStats();
                    // Check if any connections remain
                    let hasActive = false;
                    for (const [, conn] of p2p.connections) {
                        if (conn.authenticated) { hasActive = true; break; }
                    }
                    if (!hasActive) setStatus('disconnected');
                },
                onMessage: (npub, data) => {
                    const parsed = JSON.parse(data);
                    const {sig, ...stripped_data} = parsed;
                    if(!verifyPayload(stripped_data, sig, stripped_data["npub"])) {
                        console.log("could not verify payload.");
                        return;
                    };
                    if(messagelist.has(sig) || stripped_data.npub === p2p.npub) return;
                    messagelist.add(sig);
                    p2p.broadcast(data);
                    addChat(parsed.msg, 'incoming', npub);
                },
            });

            document.getElementById('myNpub').textContent = p2p.npub;

            // Register all loaded peers with the P2P instance
            for (const npub of p2p.peers) {
                if (npub !== p2p.npub) {
                    p2p.addPeer(npub);
                }
            }

            renderPeerList();

            // Periodic UI refresh for stats
            setInterval(() => {
                updateStats();
                renderPeerList();
            }, 5000);
        }

        init();
    </script>
</body>
</html>
