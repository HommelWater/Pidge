<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pidge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widgets=resizes-content">
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/site/style.css">
</head>
<body>
<div class="container">
  <header id="main-header">
      <img src="/icon.png" style="height:100%;">
      <div id="logo">Pidge</div>
  </header>
  <main id="feed-area">
    <div id="post-composer">
      <div class="composer-avatar" id="composer-avatar"></div>
      <div class="composer-body">
        <textarea id="post-text" placeholder="What's up?" maxlength="280"></textarea>
        <div class="composer-actions">
          
          <input type="text" id="post-image-url" placeholder="Image URL (optional)">
          <div class="composer-tools">
            <span id="char-count">0/280</span>
          </div>
          <button id="post-button">Post</button>
        </div>
      </div>
    </div>
    <div id="feed-content"></div>
  </main>
</div>
<script type="module" src="/site/app.js"></script>
</body>
</html>
