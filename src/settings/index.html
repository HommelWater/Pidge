<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pidge Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widgets=resizes-content">
    <link rel="icon" href="/icon.png">
    <link rel="stylesheet" href="/settings/style.css">
</head>
<body>
<div class="container">
    <header id="main-header">
        <img src="/icon.png" style="height:100%;">
        <div id="logo">Pidge Settings</div>
    </header>

    <h2>Settings</h2>
    <div style="margin-bottom:1rem;">
        <strong>Your Pidge ID: </strong><p id="user-id" style="word-break: break-all;"></p>
    </div>

    <hr style="margin:1rem 0;">
    <h3>WebRTC Relay (TURN)</h3>
    <p style="font-size:0.85rem;color:#555;margin-bottom:0.5rem;">
    Default uses public STUN only. If you are behind a strict firewall, add your own TURN server(e.g. from <a href="https://metered.ca" target="_blank">Metered</a> or <a href="https://xirsys.com" target="_blank">Xirsys</a>).
    </p>
    <div class="profile-form">
        <input type="text" id="turn-url" placeholder="turn:global.relay.metered.ca:443">
        <input type="text" id="turn-username" placeholder="Username">
        <input type="password" id="turn-password" placeholder="Password">
        <button id="save-ice-btn" style="width:100%;">Save TURN Settings</button>
        <button id="reset-ice-btn">Reset to Default (STUN only)</button>
    </div>

    <hr style="margin:1rem 0;">
    <h3>Your Profile</h3>
    <div class="profile-form">
        <input type="text" id="profile-nsec" placeholder="NSEC private key">
        <input type="text" id="profile-npub" placeholder="NPUB public key">
        <input type="text" id="profile-name" placeholder="Display Name">
        <input type="text" id="profile-avatar" placeholder="Avatar Image URL">
        <textarea id="profile-bio" placeholder="Bio" maxlength="160" style="height:60px; resize:none;"></textarea>
        <button id="save-profile">Save Profile</button>
    </div>

    <hr style="margin:1rem 0;">
    <h3>Your Peers</h3>
    <div class="profile-form">
        <input type="text" id="peer-npub" placeholder="Peer NPUB">
        <button id="add-peer">Add Peer</button>
        <div class="user-list" style="display: flex;justify-content: space-between;">
            <div class="column">
                <div class="column-header">Username</div>
            </div>
            <div class="column">
                <div class="column-header">NPUB</div>
            </div>
            <div class="column">
                <div class="column-header">Delete Peer</div>
            </div>
        </div>
    </div>
  </div>
</div>
<script type="module" src="/settings/settings.js"></script>
</body>
</html>
